<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origins</title>
<!--FONTS--><link rel="stylesheet" href="fonts/jost.css"><!--/FONTS-->
<style>
  html, body { margin: 0; height: 100%; background: #09090A; overflow: hidden; }
  body { display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  #card { position: relative; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  #card canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cgl, #cov { visibility: hidden; }
  #c2d { z-index: 2; }  #cov { z-index: 3; pointer-events: none; }
  #card.ready { cursor: pointer; }  #card.is3d { cursor: grab; }  #card.is3d:active { cursor: grabbing; }
  #hint { position: absolute; left: 0; right: 0; z-index: 4; text-align: center; pointer-events: none;
    font: 300 12px Jost, sans-serif; letter-spacing: .28em; color: #8f8d87; opacity: 0; transition: opacity .6s ease; }
  #card.ready #hint { animation: hintIn 3.2s ease .4s both; }
  #card.ready:hover #hint, #card.ready:focus-visible #hint { opacity: .9; animation: none; }
  @keyframes hintIn { 0% { opacity: 0 } 25% { opacity: .9 } 70% { opacity: .9 } 100% { opacity: .38 } }
  @media (pointer: coarse) { #card.ready #hint { animation: none; opacity: .6; } }
</style>
<!--ORIGINS--><script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script src="origins.js"></script><!--/ORIGINS-->
</head><body>
<div id="card" tabindex="0" role="button" aria-label="Origins artwork. Press to switch between 2D and 3D.">
  <canvas id="cgl"></canvas><canvas id="cov"></canvas><canvas id="c2d"></canvas>
  <div id="hint">VIEW IN 3D</div>
</div>
<!--APP--><script type="module" src="src/token.js"></script><!--/APP-->
</body></html>
